name: bosch-homecom-mqtt-bridge

services:
  mqtt:
    image: eclipse-mosquitto:2@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  bridge:
    depends_on:
      - mqtt
    environment:
      MQTT_URL: mqtt://mqtt:1883
