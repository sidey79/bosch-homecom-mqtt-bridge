name: bosch-homecom-mqtt-bridge

services:
  mqtt:
    image: eclipse-mosquitto:2@sha256:48b5f8c14504da1155156282ecc557897ff002cd60fd604aa2fd74d47bb725ff
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  bridge:
    depends_on:
      - mqtt
    environment:
      MQTT_URL: mqtt://mqtt:1883
