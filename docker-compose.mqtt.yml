name: bosch-homecom-mqtt-bridge

services:
  mqtt:
    image: eclipse-mosquitto:2@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  bridge:
    depends_on:
      - mqtt
    environment:
      MQTT_URL: mqtt://mqtt:1883
