name: bosch-homecom-mqtt-bridge

services:
  mqtt:
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  bridge:
    depends_on:
      - mqtt
    environment:
      MQTT_URL: mqtt://mqtt:1883
