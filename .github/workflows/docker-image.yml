name: Docker Image Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish_version_tags: ${{ steps.publish.outputs.publish_version_tags }}
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      stable: ${{ steps.version.outputs.stable }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine whether to publish version tags
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          publish_version_tags=false
          base="${{ github.event.before }}"
          head="${{ github.sha }}"

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse "${head}^" >/dev/null 2>&1; then
              base="${head}^"
            else
              base="$head"
            fi
          fi

          if [ "$base" != "$head" ] && ! git diff --quiet "$base" "$head" -- VERSION; then
            publish_version_tags=true
          fi

          echo "publish_version_tags=$publish_version_tags" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "VERSION must be valid SemVer without build metadata: $version" >&2
            exit 1
          fi

          core="${version%%-*}"
          major="${core%%.*}"
          minor="${core%.*}"
          if [ "$version" = "$core" ]; then
            stable=true
          else
            stable=false
          fi

          {
            echo "version=$version"
            echo "major=$major"
            echo "minor=$minor"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check that all modules compile
        run: python -m compileall -q src tests

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY_IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}

      - name: Export image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.publish_version_tags == 'true' }}
            type=raw,value=${{ needs.prepare.outputs.minor }},enable=${{ needs.prepare.outputs.stable == 'true' && needs.prepare.outputs.publish_version_tags == 'true' }}
            type=raw,value=${{ needs.prepare.outputs.major }},enable=${{ needs.prepare.outputs.stable == 'true' && needs.prepare.outputs.publish_version_tags == 'true' }}
            type=sha,prefix=sha-

      - name: Create multi-arch manifest
        env:
          METADATA: ${{ steps.meta.outputs.json }}
        shell: bash
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            tag_args+=("--tag" "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA")

          digest_args=()
          for digest_file in /tmp/digests/*; do
            digest_args+=("${REGISTRY_IMAGE}@sha256:$(basename "$digest_file")")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
